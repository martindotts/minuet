<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><code>SAVE20</code> takes 20% off <strong>eligible items</strong>, once they reach 100. Gift cards are not eligible.</p>

  <svg viewBox="0 0 440 96" role="img" aria-label="Of the 170 in the cart, 120 is eligible: 20 percent of 120 is 24.">
    <rect x="40" y="20" width="240" height="22" rx="3" class="bar coupon" />
    <text x="160" y="35" class="in-bar">Headphones 120</text>
    <rect x="282" y="20" width="100" height="22" rx="3" class="bar excluded" />
    <text x="332" y="35" class="in-bar">Gift card 50</text>

    <line x1="240" y1="12" x2="240" y2="50" class="threshold" />
    <text x="240" y="64" class="muted" text-anchor="middle">100</text>

    <text x="160" y="88" class="amount" text-anchor="middle">20% of 120 = 24</text>
    <text x="332" y="88" class="muted" text-anchor="middle">not counted</text>
  </svg>

  <p>So the discount is <strong>24</strong>, not 34: the coupon only sees 120 of the 170.</p>
</body>
</html>
