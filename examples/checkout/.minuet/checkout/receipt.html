<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg viewBox="0 0 440 130" role="img" aria-label="Subtotal 170, coupon minus 24, free shipping, total 146">
    <text x="0" y="22" class="label">Subtotal</text>
    <rect x="90" y="10" width="272" height="18" rx="3" class="bar" />
    <text x="370" y="23" class="amount">170</text>

    <text x="0" y="52" class="label">SAVE20</text>
    <rect x="323.6" y="40" width="38.4" height="18" rx="3" class="bar coupon" />
    <text x="370" y="53" class="amount">−24</text>

    <text x="0" y="82" class="label">Shipping</text>
    <rect x="322.6" y="70" width="2" height="18" class="bar shipping" />
    <text x="334" y="83" class="amount">+0 free</text>

    <line x1="90" y1="98" x2="440" y2="98" stroke="currentColor" opacity="0.3" />
    <text x="0" y="120" class="label">Total</text>
    <rect x="90" y="108" width="233.6" height="18" rx="3" class="bar total" />
    <text x="332" y="121" class="amount">146</text>
  </svg>
</body>
</html>
